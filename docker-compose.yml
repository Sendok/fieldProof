name: fieldproof

x-app-environment: &app-environment
  NODE_ENV: development
  APP_URL: http://localhost:3000
  AUTH_SECRET: development-only-secret-at-least-32-characters
  DATABASE_URL: postgresql://fieldproof:fieldproof@postgres:5432/fieldproof
  REDIS_URL: redis://redis:6379
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  EMAIL_FROM: noreply@fieldproof.local
  DEMO_REQUEST_TO: sales@fieldproof.local
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: fieldproof
  S3_ACCESS_KEY_ID: fieldproof
  S3_SECRET_ACCESS_KEY: fieldproof-dev-secret
  S3_FORCE_PATH_STYLE: "true"

services:
  app:
    build:
      context: .
      target: development
    command: pnpm dev --hostname 0.0.0.0
    environment: *app-environment
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      target: development
    command: pnpm worker:dev
    environment: *app-environment
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fieldproof
      POSTGRES_USER: fieldproof
      POSTGRES_PASSWORD: fieldproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldproof -d fieldproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fieldproof
      MINIO_ROOT_PASSWORD: fieldproof-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      - ./infra/minio/cors.xml:/config/cors.xml:ro
    command: >-
      -c "mc alias set local http://minio:9000 fieldproof fieldproof-dev-secret &&
      mc mb --ignore-existing local/fieldproof &&
      mc cors set local/fieldproof /config/cors.xml &&
      mc anonymous set none local/fieldproof"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  app_node_modules:
  next_cache:
  postgres_data:
  redis_data:
  minio_data:
